name: CI Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test-and-lint:
    name: Run Tests and Linter
    runs-on: ubuntu-latest
    env:
      PROMPTS_FILE_PATH: ./config/prompts.yaml
      DB_STORAGE_URL: "sqlite:///./data/test.db"
      TEST_TRANSCRIPT: ./tests/api/yt_20260806_futurumequities_QzTrr-pFSJM_transcript.txt

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Run tests with coverage
        run: uv run pytest --cov=text_summarizer --cov-report=term-missing

      - name: Type check with mypy
        run: uv run mypy src/
        continue-on-error: true
