[project]
name = "text-summarizer"
version = "0.1.0"
description = "Financial video analysis with LLMs"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.0",
  "chromadb>=1.5.9",
  "fastapi-swagger-dark>=0.0.9",
  "fastapi[standard]>=0.143.0",
  "jinja2>=3.1.6",
  "langchain-text-splitters>=1.1.2",
  "numpy>=2.5.1",
  "ollama>=0.6.2",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.3",
  "slowapi>=0.1.10",
  "sqlalchemy>=2.0.51",
  "streamlit>=1.61.1",
  "uvicorn[standard]>=0.52.4",
  "youtube-transcript-api>=1.2.4",
  "yt-dlp[default]>=2026.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "marimo>=0.24.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-uuid>=1.0.0",
    "ruff>=0.16.2",
]

[tool.ruff.lint]
# Add DTZ007 to the ignore list
ignore = ["DTZ007"]

[tool.ruff]
# Exclude a specific file or directory
extend-exclude = [
    "vendor/*",
    "**/migrations/*.py"
]   
