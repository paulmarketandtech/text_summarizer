[project]
name = "text-summarizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19.0",
  "chromadb>=1.5.9",
  "numpy>=2.5.1",
  "ollama>=0.6.2",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.3",
  "sentence-transformers>=5.6.1",
  "sqlalchemy>=2.0.51",
  "youtube-transcript-api>=1.2.4",
  "yt-dlp[default]>=2026.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
]
