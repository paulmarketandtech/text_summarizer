[project]
name = "text-summarizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.5.1",
  "ollama>=0.6.2",
  "python-dotenv>=1.2.2",
  "youtube-transcript-api>=1.2.4",
  "yt-dlp[default]>=2026.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
